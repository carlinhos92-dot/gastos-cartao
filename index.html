<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Gastos no Cartão</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --azul: #1a73e8; --azul-escuro: #1557b0; --verde: #16a34a; --vermelho: #dc2626; --cinza: #f1f3f4; --cinza-esc: #5f6368; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--cinza); color: #202124; min-height: 100vh; padding-bottom: 80px; }

    /* HEADER */
    .header { background: var(--azul); color: white; padding: 20px 16px; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header .total-box { background: rgba(255,255,255,0.15); border-radius: 12px; padding: 12px 16px; margin-top: 12px; }
    .header .total-box .label { font-size: 13px; opacity: 0.9; }
    .header .total-box .valor { font-size: 28px; font-weight: 700; }
    .header .total-box.parcial { margin-top: 8px; }
    .header .total-box.parcial .valor { font-size: 22px; }

    /* LISTA */
    .lista { padding: 16px; }
    .lista h2 { font-size: 16px; color: var(--cinza-esc); margin-bottom: 12px; }
    .item { background: white; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .item .info { flex: 1; }
    .item .produto { font-size: 15px; font-weight: 600; }
    .item .meta { font-size: 12px; color: var(--cinza-esc); margin-top: 4px; }
    .item .badge { font-size: 11px; background: var(--cinza); padding: 2px 8px; border-radius: 10px; margin-right: 6px; }
    .item-actions { display: flex; align-items: center; gap: 8px; }
    .item .valor { font-size: 16px; font-weight: 700; color: var(--vermelho); white-space: nowrap; }
    .btn-editar { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 8px; color: var(--cinza-esc); }
    .vazio { text-align: center; color: var(--cinza-esc); padding: 40px 20px; font-size: 14px; }

    /* FAB */
    .fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; background: var(--azul); color: white; border: none; border-radius: 50%; font-size: 28px; box-shadow: 0 4px 12px rgba(26,115,232,0.4); cursor: pointer; z-index: 100; display: flex; align-items: center; justify-content: center; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: flex-end; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 20px 20px 0 0; padding: 24px 20px 32px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal h2 { font-size: 20px; margin-bottom: 20px; }
    .campo { margin-bottom: 16px; }
    .campo label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .campo input, .campo select { width: 100%; border: 2px solid #e0e0e0; border-radius: 10px; padding: 12px 14px; font-size: 16px; transition: border-color 0.2s; }
    .campo input:focus, .campo select:focus { outline: none; border-color: var(--azul); }
    .btn-salvar { width: 100%; background: var(--azul); color: white; border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-salvar:active { background: var(--azul-escuro); }
    .btn-fechar { width: 100%; background: transparent; color: var(--cinza-esc); border: none; padding: 12px; font-size: 14px; cursor: pointer; margin-top: 4px; }

    /* STATUS */
    .status { text-align: center; padding: 8px; font-size: 13px; color: var(--cinza-esc); }
    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--verde); color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%; text-align: center; word-wrap: break-word; }
    .toast.show { opacity: 1; }
    .toast.erro { background: var(--vermelho); }
  </style>
</head>
<body>

  <div class="header">
    <h1>💳 Gastos no Cartão</h1>
    <div class="total-box">
      <div class="label">Total gasto neste mês</div>
      <div class="valor" id="totalMes">R$ 0,00</div>
    </div>
    <div class="total-box parcial">
      <div class="label">Total parcial acumulado</div>
      <div class="valor" id="totalParcial">R$ 0,00</div>
    </div>
  </div>

  <div class="lista">
    <h2>Compras registradas</h2>
    <div id="listaCompras"></div>
    <div class="status" id="status">Carregando…</div>
  </div>

  <button class="fab" onclick="abrirModal()">+</button>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modalTitulo">Registrar compra</h2>
      <div class="campo">
        <label>Quem está registrando?</label>
        <select id="usuario">
          <option value="">Selecione…</option>
          <option value="Hollanda">Hollanda</option>
          <option value="Fernanda">Fernanda</option>
        </select>
      </div>
      <div class="campo">
        <label>Valor da compra (R$)</label>
        <input type="number" id="valor" step="0.01" placeholder="Ex: 49,90" inputmode="decimal">
      </div>
      <div class="campo">
        <label>Nome do produto</label>
        <input type="text" id="produto" placeholder="Ex: Supermercado Pão de Açúcar">
      </div>
      <div class="campo">
        <label>Data da compra</label>
        <input type="date" id="data">
      </div>
      <div class="campo">
        <label>Tipo de Compra</label>
        <select id="tipoCompra">
          <option value="">Selecione…</option>
          <option value="Hollanda">Hollanda</option>
          <option value="Fernanda">Fernanda</option>
          <option value="Casal">Casal</option>
        </select>
      </div>
      <button class="btn-salvar" id="btnSalvar" onclick="salvarCompra()">Salvar compra</button>
      <button class="btn-fechar" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
